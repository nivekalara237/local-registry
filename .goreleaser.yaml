version: 2

project_name: local-registry

before:
  hooks:
    - go mod tidy -diff # fail if go.mod/go.sum are not tidy

builds:
  - id: local-registry
    main: ./cmd
    binary: local-registry
    env:
      - CGO_ENABLED=0
    goos: [linux, darwin, windows]
    goarch: [amd64, arm64]
    flags: [-trimpath]
    ldflags:
      - -s -w -X main.version={{ .Tag }}
    mod_timestamp: "{{ .CommitTimestamp }}"

archives:
  - id: default
    ids: [local-registry]
    formats: [tar.gz]
    format_overrides:
      - goos: windows
        formats: [zip]
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    files:
      - README.md
      - README.fr.md
      - scripts/upload.sh
      - scripts/publish-to-local-registry.sh

checksum:
  name_template: "{{ .ProjectName }}_{{ .Version }}_checksums.txt"
  algorithm: sha256

# SBOM (SPDX) of each archive, generated by syft.
sboms:
  - artifacts: archive

# Keyless signature (Sigstore, GitHub OIDC) of the checksums file: verifying it covers every archive.
signs:
  - cmd: cosign
    artifacts: checksum
    signature: "${artifact}.sigstore.json"
    args: ["sign-blob", "--bundle=${signature}", "--yes", "${artifact}"]

dockers_v2:
  - id: image
    ids: [local-registry]
    dockerfile: Dockerfile
    images:
      - "docker.io/{{ .Env.DOCKERHUB_USERNAME }}/local-registry"
    tags:
      - "{{ .Version }}"
      - "{{ if not .Prerelease }}{{ .Major }}.{{ .Minor }}{{ end }}"
      - "{{ if not .Prerelease }}latest{{ end }}"
    platforms: [linux/amd64, linux/arm64]
    sbom: true
    labels:
      org.opencontainers.image.title: local-registry
      org.opencontainers.image.description: Local HTTP registry for goreleaser releases
      org.opencontainers.image.version: "{{ .Version }}"
      org.opencontainers.image.revision: "{{ .FullCommit }}"
      org.opencontainers.image.created: "{{ .Date }}"
      org.opencontainers.image.source: https://github.com/nivekalara237/local-registry
      org.opencontainers.image.url: https://github.com/nivekalara237/local-registry

# Keyless signature of the pushed image.
docker_signs:
  - cmd: cosign
    artifacts: manifests
    args: ["sign", "--yes", "${artifact}@${digest}"]

changelog:
  use: github
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"
      - "^chore:"

release:
  github:
    owner: nivekalara237
    name: local-registry
  prerelease: auto
  footer: |
    **Docker image**: `docker pull {{ .Env.DOCKERHUB_USERNAME }}/local-registry:{{ .Version }}`

    **Verify the checksums file** (Sigstore keyless signature):
    ```sh
    cosign verify-blob --bundle {{ .ProjectName }}_{{ .Version }}_checksums.txt.sigstore.json \
      --certificate-identity-regexp 'https://github.com/nivekalara237/local-registry/.github/workflows/release.yml@.*' \
      --certificate-oidc-issuer https://token.actions.githubusercontent.com \
      {{ .ProjectName }}_{{ .Version }}_checksums.txt
    ```
