# Release on a v* tag:
#   1-3  ci.yml on the tagged commit
#   4a   build every artifact and the image, scan and smoke-test the image (nothing published)
#   ⏸    manual approval: environment "production" (Settings → Environments → required reviewers)
#   4b+5 push the image to Docker Hub and ghcr.io and create the GitHub release (goreleaser)
#
# Settings:
#   variable DOCKERHUB_USERNAME (repository or environment "production")
#   secret   DOCKERHUB_TOKEN    (environment "production": only readable after approval)
#   ghcr.io uses GITHUB_TOKEN; the package is created private on the first push
#   (Packages → local-registry → Package settings → visibility).
name: release

on:
  push:
    tags: ["v*"]

permissions: {}

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  GORELEASER_VERSION: v2.18.3
  TRIVY_VERSION: v0.75.0

jobs:
  ci:
    name: 1-3. ci
    uses: ./.github/workflows/ci.yml
    permissions:
      contents: read
      security-events: write

  build:
    name: 4a. build and scan
    needs: ci
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: goreleaser (snapshot, nothing published)
        uses: goreleaser/goreleaser-action@f06c13b6b1a9625abc9e6e439d9c05a8f2190e94 # v7.2.3
        with:
          version: ${{ env.GORELEASER_VERSION }}
          args: release --snapshot --clean --skip=docker,sign,sbom
        env:
          DOCKERHUB_USERNAME: ${{ vars.DOCKERHUB_USERNAME }}
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: image build context (same layout as goreleaser dockers_v2)
        run: |
          mkdir -p ctx/linux/amd64 ctx/linux/arm64
          cp Dockerfile ctx/
          cp dist/local-registry_linux_amd64_v1/local-registry ctx/linux/amd64/
          cp dist/local-registry_linux_arm64_v8.0/local-registry ctx/linux/arm64/
      - name: build image linux/arm64
        run: docker buildx build --platform linux/arm64 ctx
      - name: build image linux/amd64
        run: docker buildx build --platform linux/amd64 --load -t local-registry:ci ctx
      - name: smoke test
        run: |
          docker run -d --name lr -p 8077:8077 local-registry:ci
          for i in $(seq 1 20); do
            curl -fsS http://127.0.0.1:8077/healthz && break
            sleep 1
          done
          curl -fsS http://127.0.0.1:8077/healthz
          docker run --rm local-registry:ci version
          test "$(docker inspect -f '{{.Config.User}}' local-registry:ci)" = "registry:registry"
      - name: smoke test logs
        if: always()
        run: docker logs lr || true
      - name: trivy image gate (HIGH/CRITICAL with a fix, secrets)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          version: ${{ env.TRIVY_VERSION }}
          scan-type: image
          image-ref: local-registry:ci
          scanners: vuln,secret
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          format: table
          exit-code: "1"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist-snapshot
          path: |
            dist/*.tar.gz
            dist/*.zip
            dist/*_checksums.txt
          retention-days: 7

  publish:
    name: 4b+5. docker push (Docker Hub, ghcr.io) and GitHub release
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: prod
      url: https://github.com/${{ github.repository }}/releases/tag/${{ github.ref_name }}
    permissions:
      contents: write # create the GitHub release
      id-token: write # cosign keyless signatures (Sigstore)
      packages: write # push the image to ghcr.io
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
      - uses: anchore/sbom-action/download-syft@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
      - name: goreleaser release
        uses: goreleaser/goreleaser-action@f06c13b6b1a9625abc9e6e439d9c05a8f2190e94 # v7.2.3
        with:
          version: ${{ env.GORELEASER_VERSION }}
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DOCKERHUB_USERNAME: ${{ vars.DOCKERHUB_USERNAME }}
