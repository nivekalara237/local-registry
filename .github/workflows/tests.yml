name: tests

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_call:
    secrets:
      CODECOV_TOKEN:
        required: false
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }} # never cancel a release run

env:
  COVERAGE_MIN: "80" # percent of statements; below it, the tests job fails

jobs:
  testing:
    name: testing
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name != github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: go test
        run: go test -race -count=1 -covermode=atomic -coverprofile=coverage.out ./...
      - name: coverage summary
        run: go tool cover -func=coverage.out | tail -1 | tee -a "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage
          path: coverage.out
          retention-days: 14
      - name: upload coverage to Codecov
        # A Codecov outage or a missing token (fork pull requests) must not fail the tests.
        continue-on-error: true
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: coverage.out
          disable_search: true
          fail_ci_if_error: false
      - name: coverage gate (minimum ${{ env.COVERAGE_MIN }}%)
        # Last step: the report and the Codecov upload happen even when the gate fails.
        run: |
          total=$(go tool cover -func=coverage.out | awk '/^total:/ { sub("%", "", $3); print $3 }')
          if awk -v t="$total" -v m="$COVERAGE_MIN" 'BEGIN { exit !(t + 0 >= m + 0) }'; then
            echo "coverage ${total}% (minimum ${COVERAGE_MIN}%)"
          else
            echo "::error::coverage ${total}% is below the ${COVERAGE_MIN}% minimum"
            exit 1
          fi
