name: e2e

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: e2e-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }} # never cancel a release run

env:
  HURL_VERSION: 8.1.0
  HURL_DEB_SHA256: c56222c8923d3940533ac3d7085f66cb6fa6c05639f33aaeef8d857ab70622f9 # hurl_8.1.0_amd64.deb

jobs:
  hurl:
    name: hurl
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name != github.repository
    # The hurl .deb depends on libxml2, which recent Ubuntu releases no longer provide under that
    # name: keep an LTS where it installs, and move up when hurl ships a package for the new one.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: install hurl ${{ env.HURL_VERSION }}
        run: |
          deb="hurl_${HURL_VERSION}_amd64.deb"
          curl -fsSL -o "$RUNNER_TEMP/$deb" "https://github.com/Orange-OpenSource/hurl/releases/download/${HURL_VERSION}/$deb"
          echo "${HURL_DEB_SHA256}  $RUNNER_TEMP/$deb" | sha256sum -c -
          sudo apt-get install -y --no-install-recommends "$RUNNER_TEMP/$deb"
          hurl --version
      - name: hurl scenarios
        env:
          HURL_REPORT: ${{ runner.temp }}/hurl-report
        run: e2e/hurl/run.sh
      - name: summary
        if: always()
        run: |
          junit="$RUNNER_TEMP/hurl-report/junit.xml"
          [ -f "$junit" ] || exit 0
          tests=$(grep -o 'tests="[0-9]*"' "$junit" | head -1 | tr -dc 0-9)
          failures=$(grep -o 'failures="[0-9]*"' "$junit" | head -1 | tr -dc 0-9)
          errors=$(grep -o 'errors="[0-9]*"' "$junit" | head -1 | tr -dc 0-9)
          echo "hurl: ${tests:-0} files, ${failures:-0} failures, ${errors:-0} errors" | tee -a "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: hurl-report
          path: ${{ runner.temp }}/hurl-report
          retention-days: 14
          if-no-files-found: ignore
